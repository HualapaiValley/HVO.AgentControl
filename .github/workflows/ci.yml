name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HVO.AgentControl.slnx

      - name: Build
        run: dotnet build HVO.AgentControl.slnx --no-restore --configuration Release --warnaserror

      - name: Check formatting
        run: dotnet format HVO.AgentControl.slnx --no-restore --verify-no-changes

      - name: Unit and persistence tests
        run: dotnet test HVO.AgentControl.slnx --no-build --configuration Release

      - name: Coordination exercise tests (when present)
        run: |
          if test -f tests/CoordinationLab/CoordinationLab.csproj; then
            dotnet test tests/CoordinationLab/CoordinationLab.csproj --configuration Release
            dotnet format tests/CoordinationLab/CoordinationLab.csproj --no-restore --verify-no-changes
          fi

      - name: Start disposable SSH fixtures
        run: ./tests/Fixtures/start.sh

      - name: SSH and recovery integration tests
        env:
          HVO_SSH_FIXTURES: 1
        run: dotnet test HVO.AgentControl.slnx --no-build --configuration Release

      - name: Remove disposable SSH fixtures
        if: always()
        run: docker rm -f hvo-agentcontrol-fixture-a hvo-agentcontrol-fixture-b || true
