name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Set up Node for quick script checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore
        run: dotnet restore HVO.AgentControl.slnx
      - name: Build
        run: dotnet build HVO.AgentControl.slnx --no-restore --configuration Release --warnaserror
      - name: Check formatting
        run: dotnet format HVO.AgentControl.slnx --no-restore --verify-no-changes
      - name: Quick repository regressions
        run: |
          python3 tests/test_backlog_priority.py
          python3 tests/test_soak_runner.py scripts/run-coordination-soak.sh
          node --test tests/Browser/setup-recovery-ownership.test.cjs
          node tests/Browser/terminal-target-selection.test.cjs
          node --test tests/Browser/terminal-assets.test.cjs
          node --test tests/Browser/onboarding-cleanup.test.cjs
