name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      HVO_GITHUB_CLI_TESTS: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HVO.AgentControl.slnx

      - name: Build
        run: dotnet build HVO.AgentControl.slnx --no-restore --configuration Release --warnaserror

      - name: Check formatting
        run: dotnet format HVO.AgentControl.slnx --no-restore --verify-no-changes

      - name: Backlog priority regression checks
        run: python3 tests/test_backlog_priority.py

      - name: Soak runner regression checks
        run: python3 tests/test_soak_runner.py scripts/run-coordination-soak.sh

      - name: Unit and persistence tests
        run: dotnet test HVO.AgentControl.slnx --no-build --configuration Release

      - name: Coordination exercise tests (when present)
        run: |
          if test -f tests/CoordinationLab/CoordinationLab.csproj; then
            dotnet test tests/CoordinationLab/CoordinationLab.csproj --configuration Release
            dotnet format tests/CoordinationLab/CoordinationLab.csproj --no-restore --verify-no-changes
          fi

      - name: Start disposable SSH fixtures
        run: ./tests/Fixtures/start.sh

      - name: SSH and recovery integration tests
        env:
          HVO_SSH_FIXTURES: 1
        run: dotnet test HVO.AgentControl.slnx --no-build --configuration Release

      - name: Remove disposable SSH fixtures
        if: always()
        run: docker rm -f hvo-agentcontrol-fixture-a hvo-agentcontrol-fixture-b || true

  published-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/Browser/package-lock.json
      - name: Install browser dependencies
        working-directory: tests/Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Publish application
        run: dotnet publish src/HVO.AgentControl --configuration Release --output artifacts/published-ui
      - name: Test published desktop and mobile UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui-data artifacts/ui-secrets
          python3 -c 'import secrets,pathlib; p=pathlib.Path("artifacts/ui-secrets/owner-password"); p.write_text(secrets.token_urlsafe(32)); p.chmod(0o600)'
          export Control__DataDirectory="$PWD/artifacts/ui-data"
          export Control__SecretsDirectory="$PWD/artifacts/ui-secrets"
          export Control__AllowInsecureLocalHttp=true
          export ASPNETCORE_URLS=http://127.0.0.1:5058
          (cd artifacts/published-ui && exec dotnet HVO.AgentControl.dll) > artifacts/ui-host.log 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:5058/health/ready > /dev/null; then break; fi
            sleep 1
          done
          export HVO_BASE_URL=http://127.0.0.1:5058
          export HVO_OWNER_PASSWORD_FILE="$PWD/artifacts/ui-secrets/owner-password"
          HVO_PROVIDER_KEY_FIXTURE=1 node tests/Browser/package-smoke.cjs
      - name: Upload UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-ui-diagnostics
          path: artifacts/ui-host.log
