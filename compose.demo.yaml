name: hvo-agentcontrol-demo
services:
  agentcontrol:
    container_name: hvo-agentcontrol-demo-server
    build:
      context: .
      args:
        CONTROL_UID: ${CONTROL_UID:-1000}
        CONTROL_GID: ${CONTROL_GID:-1000}
    restart: unless-stopped
    # The existing demo client uses the default bridge and its saved IP address.
    network_mode: bridge
    ports:
      - "${DEMO_BIND_ADDRESS:-127.0.0.1}:5054:8080"
    environment:
      # Explicit HTTP exception for this development demo.
      Control__AllowInsecureLocalHttp: "true"
      Logging__LogLevel__Default: Warning
    volumes:
      - "${DEMO_DATA_DIRECTORY:-./.fixture/demo-data}:/data"
      - "${DEMO_SECRETS_DIRECTORY:-./.fixture/demo-secrets}:/run/secrets:ro"
    stop_grace_period: 30s
  coordinator:
    profiles: [coordinator]
    container_name: hvo-agentcontrol-coordinator
    build:
      context: docker/coordinator
    restart: unless-stopped
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - coordinator-home:/home/agent
      - coordinator-ssh:/etc/ssh
      - ./.fixture/coordinator-auth:/run/agentcontrol:ro
volumes:
  coordinator-home:
  coordinator-ssh:
