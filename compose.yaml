name: agentcontrol-v2
services:
  control:
    build:
      context: .
      target: final
    environment:
      Control__Enabled: "true"
      # Agent-owned tree (UID 1000): OpenCode home, workspace, tmux.
      Control__DataDirectory: /data
      # Controller-private state (UID 1001, mode 0700): runtime identity.
      Control__PrivateDataDirectory: /control-data
      # Host-owned, agent-readable orientation (UID 1001 dir 0755, file 0644).
      Control__InstructionsDirectory: /agent-config
      # The only privileged component; the agent identity cannot execute it.
      Control__AgentLauncher: /usr/local/bin/agentcontrol-launch
      Control__OrganizationName: AgentControl Development
      Control__OwnerPasswordFile: /run/agentcontrol-secrets/owner-password
      # AgentControl managed-employee inference. The control manager runs the
      # non-attributable default policy lane at medium effort through the direct
      # OpenAI-compatible provider (no dashboard sync, Oh-My plugin, MCP injection
      # or dynamic discovery). The key is the named AgentControl shared managed
      # key provisioned into the external secrets volume; a missing or revoked key
      # faults this runtime before OpenCode starts and never falls back. This is
      # not the separate general interactive OpenCode key.
      Control__Model: cliproxy/default
      Control__ModelVariant: medium
      Control__CliProxyEndpoint: http://home-docker.home.lan:8317/v1
      Control__CliProxySecretFile: /run/agentcontrol-secrets/cliproxy-api-key
    volumes:
      - control-data:/data
      - control-private:/control-data
      - control-secrets:/run/agentcontrol-secrets:ro
    # Startup-only: CHOWN/DAC_OVERRIDE/FOWNER let the root entrypoint re-own the
    # pre-isolation volume (agent-owned directories and the UID 1000, mode 0600
    # legacy runtime state). SETPCAP lets it remove exactly those three from the
    # capability bounding set before exec'ing the controller, so the setuid
    # launcher can never regain them during its root phase.
    #
    # Runtime: only SETUID/SETGID (the launcher assumes the agent identity) and
    # KILL (cross-UID termination) survive into the controller's bounding set.
    #
    # Assert it against the controller, not PID 1: PID 1 is tini, which still
    # holds the startup capabilities because the bounding set is reduced in the
    # setpriv call that execs the controller. The entrypoint records the
    # controller's own PID:
    #
    #   docker compose exec -T control sh -c \
    #     'grep CapBnd /proc/$(cat /control-data/controller.pid)/status'
    #
    # The result must be 00000000000000e0 (SETUID|SETGID|KILL) - no CHOWN,
    # DAC_OVERRIDE or FOWNER. Do not use `pgrep -f HVO.AgentControl.dll`: the
    # pattern matches the inspecting command's own command line, so it returns a
    # PID even with no controller running.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETPCAP
      - SETUID
      - SETGID
      - KILL
    # no-new-privileges is deliberately NOT set: it would block the setuid
    # launcher and leave the controller running every agent process under its
    # own identity, which is the vulnerability this design removes. Every other
    # setuid binary is stripped from the image, and the launcher sets
    # no_new_privs on the child itself before exec.
    stop_grace_period: 60s
    ports:
      - "0.0.0.0:5054:8080"
    networks:
      - agents
  worker-local:
    profiles: ["worker"]
    build:
      context: .
      target: worker
    environment:
      WORKER_CONTROL_DIRECTORY: /worker-control
      WORKER_ID: worker-local
      WORKER_CONTROLLER_ID: controller-local
    volumes:
      - worker-control:/worker-control
      - worker-home:/worker/home
      - worker-workspace:/worker/workspace
      - worker-session:/worker/session
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: "no"
    networks:
      - worker-isolated
networks:
  agents:
    driver: bridge
  worker-isolated:
    internal: true
volumes:
  control-data:
  control-private:
  control-secrets:
    external: true
    name: agentcontrol-v2-secrets
  worker-control:
  worker-home:
  worker-workspace:
  worker-session:
